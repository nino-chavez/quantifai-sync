# Windows has no other check: releases cross-compile it from macOS, and
# nothing else runs the Windows file-lock path (internal/filelock).
name: windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test file lock, commit queue, path naming, updater and logon task
        run: go test -count=1 ./internal/filelock/ ./internal/git/ ./internal/ingest/ ./internal/updater/ ./internal/service/
      - name: Logon task (verbose, shows whether the task could run here)
        run: go test -count=1 -v -run "TestTask|TestSessionUser" ./internal/service/
      - name: Supervisor (crash restart, no orphaned agent)
        run: go test -count=1 -v -run "TestSupervis" ./cmd/
      # No API key yet (fresh runner, before any step stores one): the agent
      # must wait for a key, not exit, so the supervisor does not restart it
      # every 10 seconds. The same processes must still be running 25s on.
      - name: Missing API key does not restart-loop
        shell: pwsh
        run: |
          $qs = Join-Path $env:RUNNER_TEMP 'qsk'
          $exe = Join-Path $qs 'quantifai-sync.exe'
          New-Item -ItemType Directory -Force (Join-Path $qs 'watch'), "$env:USERPROFILE\.config\quantifai" | Out-Null
          go build -o $exe .
          $fwd = $qs -replace '\\', '/'
          Set-Content "$env:USERPROFILE\.config\quantifai\config.toml" @(
            "api_url = 'http://127.0.0.1:9'",
            "watch_dir = '$fwd/watch'"
          )
          & $exe install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep 5
          $before = (Get-Process quantifai-sync -ErrorAction SilentlyContinue).Id | Sort-Object
          # While it waits, /health must report the problem, not refuse the
          # connection, and answer 503 so a check of the HTTP code alone fails.
          $waiting = Invoke-RestMethod http://127.0.0.1:19876/health -TimeoutSec 5 -SkipHttpErrorCheck -StatusCodeVariable waitingCode
          "HTTP $waitingCode"
          $waiting | ConvertTo-Json -Compress
          if ($waiting.status -ne 'error' -or $waiting.problem -notlike 'no API key*') { Write-Error 'health did not report the missing key'; exit 1 }
          if ($waitingCode -ne 503) { Write-Error "health answered HTTP $waitingCode while waiting, want 503"; exit 1 }
          Start-Sleep 25
          $after = (Get-Process quantifai-sync -ErrorAction SilentlyContinue).Id | Sort-Object
          "processes at 5s:  $($before -join ', ')"
          "processes at 30s: $($after -join ', ')"
          & $exe uninstall
          if (@($before).Count -ne 2) { Write-Error 'want a supervisor and an agent running while the key is missing'; exit 1 }
          if (($before -join ',') -ne ($after -join ',')) { Write-Error 'agent was restarted while waiting for a key'; exit 1 }
          'agent waited for its key without being restarted'
          # The waiting message must be visible: the task has no console, so
          # it goes to the log file install prints.
          $log = Join-Path $env:LOCALAPPDATA 'quantifai\quantifai-sync.log'
          if (-not (Test-Path $log)) { Write-Error "no log file at $log"; exit 1 }
          Get-Content $log
          $n = @(Select-String -Path $log -Pattern 'no API key' -SimpleMatch).Count
          if ($n -ne 1) { Write-Error "want the missing-key message once in the log, found $n"; exit 1 }
          'missing-key message is in the log, once'
          exit 0
      # End to end on the runner (never in `go test`, which a developer runs on
      # their own machine): install registers the QuantifaiSync logon task and
      # stores the key in Credential Manager; the agent must start as this user,
      # read that key, and answer /health; uninstall must remove the task.
      # api_url points at a closed port, so nothing is sent anywhere.
      - name: Install, run and uninstall the agent as a logon task
        shell: pwsh
        run: |
          $qs = Join-Path $env:RUNNER_TEMP 'qs'
          $exe = Join-Path $qs 'quantifai-sync.exe'
          New-Item -ItemType Directory -Force (Join-Path $qs 'watch'), "$env:USERPROFILE\.config\quantifai" | Out-Null
          go build -ldflags "-X github.com/quantifai/sync/cmd.Version=v0.0.0-ci" -o $exe .
          $fwd = $qs -replace '\\', '/'
          Set-Content "$env:USERPROFILE\.config\quantifai\config.toml" @(
            "api_url = 'http://127.0.0.1:9'",
            "watch_dir = '$fwd/watch'",
            "log_file = '$fwd/agent.log'"
          )
          & $exe install --api-key ci-not-a-real-key
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $health = $null
          foreach ($i in 1..30) {
            try { $health = Invoke-RestMethod http://127.0.0.1:19876/health -TimeoutSec 2; break } catch { Start-Sleep 1 }
          }
          schtasks /query /tn QuantifaiSync /v /fo list | Select-String 'Status:|Last Result|Run As User|Logon Mode'
          if (-not $health) {
            if (Test-Path "$qs\agent.log") { Get-Content "$qs\agent.log" }
            Write-Error 'agent started by the logon task did not answer /health'; exit 1
          }
          $health | ConvertTo-Json -Compress
          if ($health.version -ne 'v0.0.0-ci') { Write-Error "unexpected version $($health.version)"; exit 1 }
          # Crash restart: kill the agent (the process serving /health); the
          # supervisor must start a new one.
          $agent = (Get-NetTCPConnection -LocalPort 19876 -State Listen).OwningProcess | Select-Object -First 1
          "agent pid before kill: $agent"
          Stop-Process -Id $agent -Force
          $back = $null
          foreach ($i in 1..30) {
            Start-Sleep 1
            $now = (Get-NetTCPConnection -LocalPort 19876 -State Listen -ErrorAction SilentlyContinue).OwningProcess | Select-Object -First 1
            if ($now -and $now -ne $agent) { $back = $now; break }
          }
          if (-not $back) {
            if (Test-Path "$qs\agent.log") { Get-Content "$qs\agent.log" -Tail 20 }
            Write-Error 'agent was not restarted after it was killed'; exit 1
          }
          "agent restarted as pid $back"
          Get-CimInstance Win32_Process -Filter "Name='quantifai-sync.exe'" | Select-Object ProcessId, ParentProcessId, CommandLine | Format-Table -AutoSize | Out-String -Width 300
          & $exe uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          schtasks /query /tn QuantifaiSync *> $null
          if ($LASTEXITCODE -eq 0) { Write-Error 'task still registered after uninstall'; exit 1 }
          Start-Sleep 2
          try { Invoke-RestMethod http://127.0.0.1:19876/health -TimeoutSec 2 | Out-Null; Write-Error 'agent still running after uninstall'; exit 1 } catch { 'agent stopped' }
          $left = Get-Process quantifai-sync -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Id, StartTime; Write-Error 'quantifai-sync processes left after uninstall'; exit 1 }
          'no quantifai-sync processes left'
          exit 0
      # Reinstall over a running agent, as a user upgrading by hand: a new
      # release's exe, unpacked to a new folder, runs install. The running
      # exe is locked, so the new one cannot be copied over it in place.
      # install re-points the task and /run replaces the running instance
      # (StopExisting); the supervisor's job object must take the old agent
      # down with it, or the old agent keeps the health port and the old
      # version keeps serving.
      - name: Reinstall over a running agent
        shell: pwsh
        run: |
          $qs = Join-Path $env:RUNNER_TEMP 'qsr'
          $old = Join-Path $qs 'old\quantifai-sync.exe'
          $new = Join-Path $qs 'new\quantifai-sync.exe'
          New-Item -ItemType Directory -Force (Join-Path $qs 'watch'), "$env:USERPROFILE\.config\quantifai" | Out-Null
          go build -ldflags "-X github.com/quantifai/sync/cmd.Version=v0.0.1-old" -o $old .
          go build -ldflags "-X github.com/quantifai/sync/cmd.Version=v0.0.2-new" -o $new .
          $fwd = $qs -replace '\\', '/'
          Set-Content "$env:USERPROFILE\.config\quantifai\config.toml" @(
            "api_url = 'http://127.0.0.1:9'",
            "watch_dir = '$fwd/watch'",
            "log_file = '$fwd/agent.log'"
          )
          function Version { try { (Invoke-RestMethod http://127.0.0.1:19876/health -TimeoutSec 2 -SkipHttpErrorCheck).version } catch { '' } }
          function WaitVersion($want) { foreach ($i in 1..30) { if ((Version) -eq $want) { return $true }; Start-Sleep 1 }; return $false }
          function Procs { Get-CimInstance Win32_Process -Filter "Name='quantifai-sync.exe'" | Select-Object ProcessId, ParentProcessId, ExecutablePath }
          & $old install --api-key ci-not-a-real-key
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (WaitVersion 'v0.0.1-old')) { Write-Error "old agent did not start (health: '$(Version)')"; exit 1 }
          $before = @(Procs)
          'before reinstall:'; $before | Format-Table -AutoSize | Out-String -Width 300
          & $new install
          $rc = $LASTEXITCODE
          $ok = WaitVersion 'v0.0.2-new'
          $seen = Version
          Start-Sleep 2
          $after = @(Procs)
          'after reinstall:'; $after | Format-Table -AutoSize | Out-String -Width 300
          'port 19876:'; Get-NetTCPConnection -LocalPort 19876 -ErrorAction SilentlyContinue | Select-Object State, OwningProcess | Format-Table -AutoSize | Out-String
          & $new uninstall
          Start-Sleep 2
          $left = Get-Process quantifai-sync -ErrorAction SilentlyContinue
          if ($left) { $left | Stop-Process -Force }
          if ($rc -ne 0) { Write-Error "reinstall exited $rc"; exit 1 }
          if (-not $ok) { Get-Content "$qs\agent.log" -Tail 20 -ErrorAction SilentlyContinue; Write-Error "health reports '$seen' after reinstall, want v0.0.2-new"; exit 1 }
          $stale = @($after | Where-Object { $_.ExecutablePath -ne $new -or $before.ProcessId -contains $_.ProcessId })
          if ($stale.Count) { Write-Error 'old processes still running after reinstall'; exit 1 }
          if ($after.Count -ne 2) { Write-Error "want a supervisor and an agent after reinstall, found $($after.Count)"; exit 1 }
          if ($left) { Write-Error 'quantifai-sync processes left after uninstall'; exit 1 }
          Select-String -Path "$qs\agent.log" -Pattern 'health port' -SimpleMatch -ErrorAction SilentlyContinue | ForEach-Object { "agent log: $($_.Line)" }
          'reinstall replaced the running agent: v0.0.2-new, new supervisor and agent, nothing left of the old one'
          exit 0
      # The agent starts while something else holds the health port, as the
      # old agent can for a moment while a reinstall replaces it. Its health
      # endpoint must come up once the port is free, not stay down for the
      # whole run.
      - name: Health port taken when the agent starts
        shell: pwsh
        run: |
          $qs = Join-Path $env:RUNNER_TEMP 'qsp'
          $exe = Join-Path $qs 'quantifai-sync.exe'
          New-Item -ItemType Directory -Force (Join-Path $qs 'watch'), "$env:USERPROFILE\.config\quantifai" | Out-Null
          go build -ldflags "-X github.com/quantifai/sync/cmd.Version=v0.0.3-port" -o $exe .
          $fwd = $qs -replace '\\', '/'
          Set-Content "$env:USERPROFILE\.config\quantifai\config.toml" @(
            "api_url = 'http://127.0.0.1:9'",
            "watch_dir = '$fwd/watch'",
            "log_file = '$fwd/agent.log'"
          )
          $holder = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 19876)
          $holder.Start()
          'holding 127.0.0.1:19876'
          & $exe install --api-key ci-not-a-real-key
          $rc = $LASTEXITCODE
          Start-Sleep 5
          $holder.Stop()
          'released 127.0.0.1:19876'
          $ok = $false
          foreach ($i in 1..15) {
            try { if ((Invoke-RestMethod http://127.0.0.1:19876/health -TimeoutSec 2 -SkipHttpErrorCheck).version -eq 'v0.0.3-port') { $ok = $true; "health up ${i}s after the port was released"; break } } catch { }
            Start-Sleep 1
          }
          $log = Get-Content "$qs\agent.log" -Raw -ErrorAction SilentlyContinue
          & $exe uninstall
          Start-Sleep 2
          Get-Process quantifai-sync -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($rc -ne 0) { Write-Error "install exited $rc"; exit 1 }
          if (-not $ok) { Get-Content "$qs\agent.log" -Tail 20 -ErrorAction SilentlyContinue; Write-Error 'health did not come up after the port was released'; exit 1 }
          if ($log -notmatch 'health port') { Write-Error 'the agent did not log that the health port was taken'; exit 1 }
          ($log -split "`n" | Select-String 'health port' | Select-Object -First 1).Line
          'health came up after the port was released'
          exit 0
      # Self-update end to end: an agent stamped v0.2.9-ci, installed as the
      # logon task with auto-update on, must find the real latest release,
      # replace its own running file, exit to the supervisor, and come back
      # as that release. The release's own uninstall predates the logon
      # task, so cleanup uses this commit's build from the previous step.
      - name: Self-update under the logon task
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $qs = Join-Path $env:RUNNER_TEMP 'qsu'
          $exe = Join-Path $qs 'quantifai-sync.exe'
          $tool = Join-Path $env:RUNNER_TEMP 'qs\quantifai-sync.exe'
          New-Item -ItemType Directory -Force (Join-Path $qs 'watch'), "$env:USERPROFILE\.config\quantifai" | Out-Null
          go build -ldflags "-X github.com/quantifai/sync/cmd.Version=v0.2.9-ci" -o $exe .
          # Authenticated: the runner's shared IP can exhaust the unauthenticated limit.
          try {
            $latest = (Invoke-RestMethod https://api.github.com/repos/nino-chavez/quantifai-sync/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }).tag_name
          } catch {
            Write-Error "releases/latest lookup failed: HTTP $($_.Exception.Response.StatusCode.value__) $($_.ErrorDetails.Message)"; exit 1
          }
          "latest release: $latest"
          $fwd = $qs -replace '\\', '/'
          Set-Content "$env:USERPROFILE\.config\quantifai\config.toml" @(
            "api_url = 'http://127.0.0.1:9'",
            "watch_dir = '$fwd/watch'",
            "log_file = '$fwd/agent.log'",
            "auto_update = true",
            "update_repo = 'nino-chavez/quantifai-sync'"
          )
          & $exe install --api-key ci-not-a-real-key
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $versions = @()
          foreach ($i in 1..120) {
            try {
              $v = (Invoke-RestMethod http://127.0.0.1:19876/health -TimeoutSec 2).version
              if ($versions[-1] -ne $v) { $versions += $v; "health reports $v" }
              if ($v -eq $latest) { break }
            } catch { }
            Start-Sleep 1
          }
          Get-Content "$qs\agent.log" | Select-String 'update|supervisor|starting quantifai'
          Get-ChildItem $qs -Filter 'quantifai-sync.exe*' | Format-Table Name, Length -AutoSize | Out-String
          # The supervisor must be running the new binary too, not the old one
          # it was started from, which the update renamed to .old-<n>.
          # Get-Process reports the original path for a renamed image, so test
          # the file instead: Windows refuses to delete an image a running
          # process was loaded from, and the old agent has already exited.
          Start-Sleep 3
          $procs = @(Get-Process quantifai-sync -ErrorAction SilentlyContinue)
          Get-CimInstance Win32_Process -Filter "Name = 'quantifai-sync.exe'" | Format-Table ProcessId, ParentProcessId, CreationDate -AutoSize | Out-String
          $old = @(Get-ChildItem $qs -Filter 'quantifai-sync.exe.old*')
          $locked = @()
          foreach ($f in $old) { try { Remove-Item $f.FullName -ErrorAction Stop; "removed $($f.Name)" } catch { $locked += $f.Name } }
          & $tool uninstall
          Start-Sleep 2
          $left = Get-Process quantifai-sync -ErrorAction SilentlyContinue
          if ($versions[-1] -ne $latest) { Write-Error "agent did not come back as $latest (saw: $($versions -join ', '))"; exit 1 }
          $log = Get-Content "$qs\agent.log" -Raw
          if ($log -notmatch '"version":"v0.2.9-ci"') { Write-Error 'agent never started as v0.2.9-ci'; exit 1 }
          if ($log -notmatch 'exiting so the supervisor starts the new binary') { Write-Error 'agent did not hand over to the supervisor'; exit 1 }
          if ($old.Count -eq 0) { Write-Error 'the update left no .old file to check'; exit 1 }
          if ($locked.Count -ne 0) { Write-Error "the replaced binary is still in use, so the supervisor still runs it: $($locked -join ', ')"; exit 1 }
          if ($procs.Count -ne 2) { Write-Error "want a supervisor and an agent after the update, found $($procs.Count) processes"; exit 1 }
          if ($left) { $left | Format-Table Id, StartTime; Write-Error 'quantifai-sync processes left after uninstall'; exit 1 }
          "updated from v0.2.9-ci to $latest; supervisor and agent both run the new binary; nothing left running"
          exit 0
